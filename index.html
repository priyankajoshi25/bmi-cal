<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional BMI Calculator</title>
    <link rel="stylesheet" href="bmi_cal.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="header">
                <h1>BMI Calculator</h1>
                <p>Calculate your Body Mass Index professionally</p>
            </div>

            <div class="form-section">
                <div class="input-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" placeholder="Enter your age" min="1" max="120">
                </div>

                <div class="input-group">
                    <label for="gender">Gender</label>
                    <select id="gender">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="weight">Weight (kg)</label>
                    <input type="number" id="weight" placeholder="Enter weight in kg" step="0.1" min="1">
                </div>

                <div class="input-group">
                    <label for="height">Height (cm)</label>
                    <input type="number" id="height" placeholder="Enter height in cm" min="50" max="300">
                </div>

                <button id="calculateBtn" class="calculate-btn">
                    <span class="btn-text">Calculate BMI</span>
                    <span class="btn-icon">📊</span>
                </button>
            </div>

            <div class="results-section">
                <div class="result-card" id="resultCard">
                    <div class="result-header">
                        <h3>Your BMI Result</h3>
                    </div>
                    <div class="bmi-value" id="bmiValue">--</div>
                    <div class="bmi-category" id="bmiCategory">--</div>
                </div>

                <div class="gauge-container">
                    <canvas id="bmiGauge" width="300" height="200"></canvas>
                </div>
            </div>

            <div class="history-section">
                <div class="history-header">
                    <h3>Calculation History</h3>
                    <button id="clearHistory" class="clear-btn">Clear All</button>
                </div>
                <div id="history" class="history-list"></div>
            </div>
        </div>
    </div>

    <script src="bmi_cal.js"></script>
</body>
</html>
